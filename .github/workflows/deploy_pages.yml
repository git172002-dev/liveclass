name: Deploy Admin Dashboard & Student App to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/admin_dashboard/package.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Next.js Admin Dashboard
        working-directory: apps/admin_dashboard
        run: |
          npm ci || npm install
          npm run build
          touch out/.nojekyll
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}

      - name: Build Flutter Student App for Web
        working-directory: apps/student_app
        run: |
          flutter create --org com.aethered --project-name aethered_student_app --platforms web .
          flutter pub get
          flutter build web --base-href "/liveclass/app/"
          mkdir -p ../admin_dashboard/out/app
          cp -r build/web/* ../admin_dashboard/out/app/

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/admin_dashboard/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
