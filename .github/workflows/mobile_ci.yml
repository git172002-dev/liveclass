name: Build Flutter Mobile & Tablet App (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build & Validate Mobile App (Android & iOS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android & iOS Native Scaffolding
        working-directory: apps/student_app
        run: |
          flutter create --org com.aethered --project-name aethered_student_app --platforms android,ios .

      - name: Configure Android & iOS Tablet Multi-Screen Support
        working-directory: apps/student_app
        run: |
          # Inject tablet support into AndroidManifest.xml
          sed -i 's/<application/<supports-screens android:smallScreens="true" android:normalScreens="true" android:largeScreens="true" android:xlargeScreens="true" \/>\n    <application/' android/app/src/main/AndroidManifest.xml || true

      - name: Install Dependencies
        working-directory: apps/student_app
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: apps/student_app
        run: flutter analyze --no-fatal-infos lib/

      - name: Run Widget Smoke Tests
        working-directory: apps/student_app
        run: flutter test

      - name: Build Android Release APK
        working-directory: apps/student_app
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: aethered-student-app-apk
          path: apps/student_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare Named Release APK
        run: cp apps/student_app/build/app/outputs/flutter-apk/app-release.apk aethered-student-app-v1.apk

      - name: Publish/Update GitHub Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "AetherEd Student Mobile & Tablet App v1.0.0"
          files: aethered-student-app-v1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
