name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project Scaffolding
        working-directory: apps/student_app
        run: flutter create --org com.aethered --project-name aethered_student_app --platforms android .

      - name: Install Dependencies
        working-directory: apps/student_app
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: apps/student_app
        run: flutter analyze --no-fatal-infos lib/

      - name: Build Android APK
        working-directory: apps/student_app
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: aethered-student-app-apk
          path: apps/student_app/build/app/outputs/flutter-apk/app-release.apk
